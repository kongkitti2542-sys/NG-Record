<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f5">
  <link rel="icon" href="data:,">
  <title>NG Record</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17231e;background:#f5f7f5;font-synthesis:none;--green:#176b4b;--line:#dce5df;--muted:#64736b;--red:#a33b32}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.shell{max-width:900px;margin:0 auto;padding:20px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#dff1e7;color:var(--green);font-weight:900}.brand h1{font-size:19px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:1px 0 0}.tabs{display:flex;gap:6px;background:#e9eeea;padding:5px;border-radius:12px}.tab{border:0;background:transparent;padding:10px 14px;border-radius:9px;color:#42534a;font-weight:700}.tab.active{background:white;color:var(--green);box-shadow:0 1px 4px #19372115}.panel{display:none}.panel.active{display:block}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 5px 20px #16392308}.card h2{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px;margin:0 0 22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:14px;font-weight:700}.field input{width:100%;height:52px;padding:0 13px;border:1px solid #cdd9d1;border-radius:10px;background:#fff;color:#17231e;outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #176b4b20}.field input::placeholder{color:#96a39b}.wide{grid-column:1/-1}.hint{font-size:12px;color:var(--muted)}.submit{width:100%;height:56px;border:0;border-radius:11px;background:var(--green);color:white;font-size:17px;font-weight:800;margin-top:23px}.submit:disabled{opacity:.65;cursor:wait}.notice{display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:14px}.notice.show{display:block}.notice.ok{background:#e7f5ec;color:#145d3a}.notice.error{background:#fff0ee;color:var(--red)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;align-items:center;margin:16px 0}.smallbtn{min-height:42px;border:1px solid #cbd8cf;border-radius:9px;background:white;padding:0 14px;color:#264536;font-weight:700}.smallbtn.primary{background:var(--green);color:white;border-color:var(--green)}.summary{margin-left:auto;color:var(--muted);font-size:14px}.summary strong{color:#17231e}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:590px;font-size:14px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #edf1ee}th{background:#f6f9f7;color:#485a50;font-size:12px}tbody tr:last-child td{border-bottom:0}.empty{text-align:center;padding:28px;color:var(--muted)}.qty{text-align:right;font-variant-numeric:tabular-nums}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17231e;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 6px 25px #0003;display:none}.toast.show{display:block}@media(max-width:600px){.shell{padding:14px 12px 32px}.top{align-items:flex-start;gap:12px;flex-direction:column}.tabs{width:100%}.tab{flex:1}.card{padding:18px 15px}.formgrid{grid-template-columns:1fr;gap:15px}.wide{grid-column:auto}.filters{grid-template-columns:1fr}.actions{flex-wrap:wrap}.summary{width:100%;margin:4px 0 0}.submit{margin-top:19px}}
    .storage-status{font-size:12px;color:var(--muted);margin:-8px 0 14px;padding:9px 12px;border-radius:9px;background:#eef3ef}.storage-status.error{background:#fff0ee;color:var(--red)}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">NG</div><div><h1>NG Record</h1><p>บันทึกและค้นหางานเสีย</p></div></div><nav class="tabs" aria-label="เมนู"><button class="tab active" data-tab="entry">บันทึก</button><button class="tab" data-tab="history">ประวัติ / ส่งออก</button></nav></header>
    <div class="storage-status" id="storageStatus" role="status" aria-live="polite">กำลังตรวจสอบที่เก็บข้อมูล…</div>
    <section class="panel active" id="entry"><div class="card"><h2>บันทึกรายการ NG</h2><p class="sub" id="entrySub">สแกนหรือพิมพ์ข้อมูล แล้วบันทึกข้อมูล</p>
      <form id="entryForm" autocomplete="off"><div class="formgrid">
        <div class="field"><label for="part">Part No.</label><input id="part" name="part" placeholder="สแกนหรือกรอก Part No." required autofocus></div>
        <div class="field"><label for="job">Job No.</label><input id="job" name="job" placeholder="สแกนหรือกรอก Job No." required></div>
        <div class="field wide"><label for="cause">สาเหตุการเกิด</label><input id="cause" name="cause" list="causeOptions" placeholder="ระบุสาเหตุ เช่น ไฟดับ, เครื่องเสีย"><datalist id="causeOptions"><option value="ไฟดับ"><option value="เครื่องเสีย"><option value="วัตถุดิบมีปัญหา"><option value="ตั้งค่าเครื่องจักรผิด"><option value="อื่น ๆ"></datalist></div>
        <div class="field"><label for="qty">NG Qty</label><input id="qty" name="qty" type="number" inputmode="numeric" min="1" step="1" placeholder="จำนวนงานเสีย" required></div>
        <div class="field"><label for="date">Record Date</label><input id="date" name="date" type="date" required></div>
      </div><button class="submit" id="save" type="submit">บันทึกรายการ</button><div class="notice" id="notice" role="status"></div></form>
    </div></section>
    <section class="panel" id="history"><div class="card"><h2>ประวัติรายการ</h2><p class="sub">ค้นหาและส่งออกตามตัวกรองที่เลือก</p>
      <div class="filters"><div class="field"><label for="from">วันที่เริ่มต้น</label><input type="date" id="from"></div><div class="field"><label for="to">วันที่สิ้นสุด</label><input type="date" id="to"></div><div class="field"><label for="partFilter">Part No.</label><input id="partFilter" placeholder="ค้นหา Part No."></div><div class="field"><label for="jobFilter">Job No.</label><input id="jobFilter" placeholder="ค้นหา Job No."></div></div>
      <div class="actions"><button class="smallbtn" id="clear">ล้างตัวกรอง</button><button class="smallbtn primary" id="csv">Export CSV</button><button class="smallbtn primary" id="xlsx">Export Excel (.xlsx)</button><div class="summary"><strong id="count">0</strong> รายการ · NG รวม <strong id="total">0</strong></div></div>
      <div class="tablewrap"><table><thead><tr><th>วันที่เวลา</th><th>Part No.</th><th>Job No.</th><th>สาเหตุการเกิด</th><th class="qty">NG Qty</th></tr></thead><tbody id="rows"></tbody></table></div>
    </div></section>
  </main><div class="toast" id="toast" role="status"></div>
<script src="excel-adapter.js"></script>
<script src="record-store.js"></script>
<script src="app.js"></script>
</body></html>
